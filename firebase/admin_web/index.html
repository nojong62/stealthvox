<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>StealthVox Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <strong>StealthVox Admin</strong>
    <a href="author.html" class="muted">체험 대사 입력</a>
    <a href="health.html" class="muted">헬스체크</a>
    <span id="who" class="muted"></span>
    <button id="signOut" class="ghost" hidden>로그아웃</button>
  </header>

  <main>
    <!-- 로그인 전 -->
    <section id="gate" class="card center" hidden>
      <p>관리자 구글 계정으로 로그인하세요.</p>
      <button id="signIn">Google로 로그인</button>
      <p id="gateMsg" class="error"></p>
    </section>

    <!-- 로그인 후 -->
    <section id="console" hidden>
      <form id="searchForm" class="search">
        <select id="filter">
          <option value="all">전체</option>
          <option value="members">정식회원</option>
          <option value="recent">최근 접속</option>
          <option value="buyers">구매자</option>
          <option value="test">테스트</option>
          <option value="blocked">차단</option>
        </select>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               placeholder="이메일·이름 앞부분 또는 UID (비우면 최근 접속 30명)">
        <button type="submit">검색</button>
      </form>
      <p id="status" class="muted"></p>

      <div class="split">
        <div id="results" class="list"></div>
        <div id="detail" class="detail"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
