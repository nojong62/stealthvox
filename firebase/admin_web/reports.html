<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Duo 신고</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <strong>Duo 신고</strong>
    <span id="who" class="muted"></span>
    <a href="index.html" class="muted">회원 관리</a>
  </header>

  <main>
    <section id="gate" class="card center" hidden>
      <p>관리자 구글 계정으로 로그인하세요.</p>
      <button id="signIn">Google로 로그인</button>
      <p id="gateMsg" class="error"></p>
    </section>

    <section id="console" hidden>
      <div class="inline">
        <button id="reload" class="ghost">새로고침</button>
        <span id="status" class="muted"></span>
        <span id="daily" class="muted"></span>
      </div>
      <p class="muted">
        신고 1건 = 두 사람만 다시 연결되지 않음. 24시간 안에 서로 다른 3명 = 24시간 게시판 정지(자동).
        영구 차단은 여기서 대화를 보고 결정한다.
      </p>
      <div class="card" style="margin-top:12px; overflow-x:auto">
        <table>
          <thead>
            <tr><th>신고 시각</th><th>신고자</th><th>대상</th><th>대상 누적</th><th>상태</th><th></th></tr>
          </thead>
          <tbody id="reports"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="reports.js"></script>
</body>
</html>
